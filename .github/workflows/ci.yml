name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the web app
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:3000/
          total=$(curl -fsS http://localhost:3000/api/leads | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])")
          echo "Seeded leads: $total"
          test "$total" -ge 10
          id=$(curl -fsS -X POST http://localhost:3000/api/leads -H 'Content-Type: application/json' \
            -d '{"name":"CI Check"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          curl -fsS -X POST "http://localhost:3000/api/leads/$id/discussions" -H 'Content-Type: application/json' \
            -d '{"note":"Logged from CI"}' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/leads/999999)
          test "$code" = "404"
      - name: Logs
        if: always()
        run: docker compose logs --no-color
